<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TMC Book Club</title>
<style>
:root{--bg:#FBF6EE;--ink:#2A1B2E;--muted:#6B5A66;--line:#E6D8C3;--accent:#B8472E;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1522;--ink:#FBF3E6;--muted:#C9B8BE;--line:#3d2f44;--card:#2a1f31;--accent:#F08A6E}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Georgia,"Times New Roman",serif}
.top{background:linear-gradient(180deg,#2A1B2E,#5a3139);color:#FBF3E6;text-align:center;padding:52px 16px 44px}
.eyebrow{font:700 12px/1 system-ui,sans-serif;letter-spacing:2.4px;text-transform:uppercase;color:#F8DDA8;margin:0 0 12px}
h1{font-size:clamp(2.4rem,7vw,4.2rem);line-height:1.05;margin:0;font-weight:400}
.sub{margin:12px auto 0;max-width:40ch;color:#E3CFC0;font-family:system-ui,sans-serif;font-size:1.05rem}
main{max-width:880px;margin:0 auto;padding:36px 16px 56px}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px}
@media (max-width:620px){.shelf{grid-template-columns:minmax(0,1fr);max-width:340px;margin:0 auto}}
a.book{display:block;text-decoration:none;color:inherit;text-align:center}
.cover{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;background:#ddd;border-radius:4px 10px 10px 4px;box-shadow:-6px 7px 0 rgba(0,0,0,.16),0 18px 34px rgba(0,0,0,.28);transition:transform .25s,box-shadow .25s}
a.book:hover .cover,a.book:focus-visible .cover{transform:translateY(-8px) rotate(-1deg)}
a.book:focus-visible{outline:3px solid var(--accent);outline-offset:8px;border-radius:8px}
.t{font:700 1.25rem/1.2 system-ui,sans-serif;margin-top:20px}
.a{font:1rem system-ui,sans-serif;color:var(--muted);margin-top:2px}
.chip{display:inline-block;margin-top:12px;font:700 .72rem system-ui,sans-serif;letter-spacing:1.2px;text-transform:uppercase;padding:6px 14px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.now{background:var(--accent);border-color:var(--accent);color:#fff}
footer{text-align:center;color:var(--muted);font:.95rem system-ui,sans-serif;padding:0 16px 40px}
</style>
</head>
<body>
<header class="top"><p class="eyebrow">Book Club</p><h1>TMC Book Club</h1><p class="sub">Tap a book cover to open its discussion&nbsp;page.</p></header>
<main>
<div class="shelf">
<a class="book" href="peck-and-peck.html"><img class="cover" src="covers/peck-and-peck.jpg" alt="Peck &amp; Peck by Bonnie Garmus" width="520" height="784"><div class="t">Peck &amp; Peck</div><div class="a">Bonnie Garmus</div><span class="chip now">Reading now</span></a>
<a class="book" href="whistler.html"><img class="cover" src="covers/whistler.jpg" alt="Whistler by Ann Patchett" width="520" height="789"><div class="t">Whistler</div><div class="a">Ann Patchett</div><span class="chip">Finished</span></a>
<a class="book" href="guilty-by-definition.html"><img class="cover" src="covers/guilty-by-definition.jpg" alt="Guilty by Definition by Susie Dent" width="520" height="801"><div class="t">Guilty by Definition</div><div class="a">Susie Dent</div><span class="chip">Finished</span></a>
<a class="book" href="yesteryear.html"><img class="cover" src="covers/yesteryear.jpg" alt="Yesteryear by Caro Claire Burke" width="520" height="801"><div class="t">Yesteryear</div><div class="a">Caro Claire Burke</div><span class="chip">Finished</span></a>
</div>
</main>
<footer>More books will appear here as we finish each one.</footer>
</body>
</html>
