<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Book Club</title>
<style>
:root{--bg:#fbf7ef;--ink:#2b2a33;--mut:#6a6672;--line:#e8dfcf}
@media (prefers-color-scheme: dark){:root{--bg:#1c1b22;--ink:#f1ece2;--mut:#b4aebd;--line:#3a3745}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Georgia,serif;padding:40px 16px}
.w{max-width:860px;margin:0 auto;text-align:center}
.eyebrow{font:700 12px system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
h1{font:800 clamp(32px,6vw,52px)/1.1 system-ui,sans-serif;margin:8px 0 6px}
p.s{color:var(--mut);margin:0 0 30px}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}
@media (max-width:600px){.shelf{grid-template-columns:minmax(0,1fr)}}
a.book{display:block;text-decoration:none;color:inherit}
.cover{aspect-ratio:2/3;border-radius:6px 14px 14px 6px;box-shadow:-6px 6px 0 rgba(0,0,0,.12),0 14px 28px rgba(0,0,0,.25);position:relative;overflow:hidden;transition:.25s;display:flex;flex-direction:column;justify-content:space-between;padding:26px 20px;color:#fff}
a.book:hover .cover{transform:translateY(-6px) rotate(-1deg)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:rgba(0,0,0,.18)}
.cover h2{font:800 clamp(28px,5vw,40px)/1.05 Georgia,serif;margin:0}.cover .a{font:600 15px system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;opacity:.9}
.cover svg{width:46%;align-self:center}
.wh{background:linear-gradient(170deg,#1c2a52,#4a3a78 60%,#7a4a7a)}
.pp{background:linear-gradient(170deg,#e9d6ae,#d9b98a);color:#3b2b1a}
.status{display:inline-block;margin-top:14px;font:700 12px system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:99px;border:1px solid var(--line)}
.now{background:#c8553d;color:#fff;border-color:#c8553d}
.t{font:700 19px system-ui,sans-serif;margin-top:12px}
</style></head><body><div class="w">
<div class="eyebrow">Book Club</div><h1>Our book shelf</h1><p class="s">Tap a cover to open that book’s discussion site.</p>
<div class="shelf">
<a class="book" href="peck-and-peck.html"><div class="cover pp"><div class="a">Bonnie Garmus</div>
<svg viewBox="0 0 120 150" aria-hidden="true"><defs><radialGradient id="e" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fbf3df"/><stop offset="1" stop-color="#bda070"/></radialGradient></defs><path d="M60 8C88 8 108 62 108 96c0 28-22 46-48 46S12 124 12 96C12 62 32 8 60 8Z" fill="url(#e)"/><g fill="#6b4a2b" opacity=".75"><circle cx="44" cy="52" r="3"/><circle cx="70" cy="40" r="2.2"/><circle cx="82" cy="70" r="3.4"/><circle cx="38" cy="86" r="2.6"/><circle cx="64" cy="96" r="3.8"/><circle cx="90" cy="108" r="2.4"/><circle cx="50" cy="118" r="3"/><circle cx="28" cy="108" r="2"/></g></svg>
<h2>Peck &amp; Peck</h2></div><div class="t">Peck &amp; Peck</div><span class="status now">Reading now</span></a>
<a class="book" href="index.html"><div class="cover wh"><div class="a">Ann Patchett</div>
<svg viewBox="0 0 120 120" aria-hidden="true"><g fill="#fff"><circle cx="20" cy="24" r="2"/><circle cx="60" cy="14" r="1.6"/><circle cx="96" cy="30" r="2.2"/><circle cx="34" cy="60" r="1.4"/><circle cx="84" cy="70" r="1.8"/><circle cx="58" cy="96" r="2"/></g><path d="M60 30 66 52 88 52 70 66 77 88 60 74 43 88 50 66 32 52 54 52Z" fill="#ffd978"/></svg>
<h2>Whistler</h2></div><div class="t">Whistler</div><span class="status">Finished</span></a>
</div></div></body></html>
